# Flatpak manifest. flatpak-builder was not run for this tree.
# There is no --filesystem=host. Inside the sandbox, /proc and /sys are not a
# full view of the host, and package or service queries can fail. Prefer the
# native .deb when those diagnostics matter.
app-id: org.linuxdesktopagent.Gtk
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lda-gtk
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=session-bus
  - --device=dri
modules:
  - name: lda
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/lda/cargo
    build-commands:
      - cargo build --release --locked -p lda-gtk -p lda-daemon -p lda-cli
      - install -Dm755 target/release/lda-gtk /app/bin/lda-gtk
      - install -Dm755 target/release/lda-daemon /app/bin/lda-daemon
      - install -Dm755 target/release/lda-cli /app/bin/lda-cli
      - install -Dm644 packaging/desktop/org.linuxdesktopagent.Gtk.desktop /app/share/applications/org.linuxdesktopagent.Gtk.desktop
      - install -Dm644 packaging/icons/hicolor/scalable/apps/org.linuxdesktopagent.Gtk.svg /app/share/icons/hicolor/scalable/apps/org.linuxdesktopagent.Gtk.svg
    sources:
      - type: dir
        path: ../..
